<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" data-anim="draw"><style>@keyframes k_draw{0%{opacity:0;stroke-dashoffset:1}2%{opacity:1}22%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:1}}
svg .p{animation:k_draw 5.2s cubic-bezier(.2,.8,.2,1) infinite both;transform-box:fill-box;transform-origin:center}
