svg .st{stroke-dasharray:1}
svg .p:not(.st){animation:k_fade 5.2s ease infinite both}
svg .pq{animation:k_pop 5.2s cubic-bezier(.2,.8,.2,1) infinite both}
@keyframes k_fade{0%{opacity:0}18%{opacity:1}88%{opacity:1}100%{opacity:0}}
