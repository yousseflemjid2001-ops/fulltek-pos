<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Full·Tek Resto — Caisse Tactile POS, Salle Khaima VIP, KDS & Paiements Mauritaniens">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Full·Tek Resto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Full·Tek Resto — Caisse Tactile POS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B1220;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #ft-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 38%, #132238 0%, #0B1220 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #E2E8F0;
      transition: opacity 0.28s ease;
    }
    #ft-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .ft-bar-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 20px;
    }
    .ft-bar-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #E4572E, #10B981);
      border-radius: 999px;
      animation: ft-slide 1.2s ease-in-out infinite;
    }
    @keyframes ft-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }
    .ft-sub {
      margin-top: 12px;
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.02em;
    }
    #ft-reload {
      display: none;
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #10B981;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ft-splash" aria-label="Chargement Full-Tek Resto">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="220" height="55">
      <g>
        <rect x="10" y="18" width="78" height="16" rx="8" fill="#FFFFFF"/>
        <rect x="10" y="43" width="52" height="16" rx="8" fill="#E4572E"/>
        <rect x="10" y="68" width="30" height="16" rx="8" fill="#FFFFFF"/>
      </g>
      <text x="120" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Full·Tek</text>
      <text x="122" y="87" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#E4572E">RESTO POS</text>
    </svg>
    <div class="ft-bar-track"><div class="ft-bar-fill"></div></div>
    <div class="ft-sub">Chargement de votre caisse Full·Tek Resto...</div>
    <button id="ft-reload" onclick="location.reload(true)">Recharger la page</button>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ft-splash');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }
    });
    setTimeout(function () {
      var btn = document.getElementById('ft-reload');
      if (btn) btn.style.display = 'inline-block';
    }, 20000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
